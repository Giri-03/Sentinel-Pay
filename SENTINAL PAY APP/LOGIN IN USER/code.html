<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SentinelPay | Secure Analyst Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13daec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#0a1213",
                        "charcoal": "#102022",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        body {
            font-family: 'Manrope', sans-serif;
        }
        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.25rem center;
            background-repeat: no-repeat;
            background-size: 1.25em 1.25em;
            padding-right: 1.5rem;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="bg-charcoal text-slate-100 min-h-screen font-display flex flex-col items-center justify-center p-6">
<div class="w-full max-w-[440px] flex flex-col items-center">
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary rounded-lg text-background-dark mb-4 shadow-lg shadow-primary/10">
<span class="material-symbols-outlined text-3xl font-bold">shield_with_heart</span>
</div>
<h1 class="text-2xl font-extrabold tracking-tight text-white mb-1">SentinelPay</h1>
<p class="text-slate-400 text-sm font-medium">Secure Analyst Access</p>
</div>
<div class="w-full bg-white/5 border border-white/10 rounded-2xl p-8 backdrop-blur-sm shadow-2xl">
<div class="mb-5">
<label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2" for="username">Username</label>
<div class="relative">
<input class="w-full h-12 bg-white/5 border border-white/10 rounded-lg px-4 text-sm font-medium text-white placeholder:text-slate-600 focus:ring-1 focus:ring-primary focus:border-primary transition-all outline-none" id="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<div class="mb-6">
<label class="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2" for="phone">Phone Number</label>
<div class="flex gap-2">
<div class="relative">
<select class="h-12 bg-white/5 border border-white/10 rounded-lg pl-3 pr-8 text-sm font-medium text-white focus:ring-1 focus:ring-primary focus:border-primary cursor-pointer transition-all outline-none" id="country-code">
<option class="bg-charcoal" value="+1">+1</option>
<option class="bg-charcoal" value="+44">+44</option>
<option class="bg-charcoal" value="+49">+49</option>
<option class="bg-charcoal" value="+91">+91</option>
<option class="bg-charcoal" value="+65">+65</option>
</select>
</div>
<div class="relative flex-1">
<input class="w-full h-12 bg-white/5 border border-white/10 rounded-lg px-4 text-sm font-medium text-white placeholder:text-slate-600 focus:ring-1 focus:ring-primary focus:border-primary transition-all outline-none" id="phone" placeholder="Enter phone number" type="tel"/>
</div>
</div>
<p class="mt-3 text-[11px] text-slate-500 leading-relaxed">
                    A 6-digit verification code will be sent to this number for multi-factor authentication.
                </p>
</div>
<button onclick="goToOtp()" class="w-full h-12 bg-primary text-background-dark font-bold rounded-lg hover:opacity-90 active:scale-[0.98] transition-all shadow-lg shadow-primary/10 flex items-center justify-center gap-2">
                Send OTP
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<p id="err-msg" class="text-red-400 text-xs text-center mt-3 hidden">Please enter a valid phone number (min 10 digits).</p>
</div>
<div class="mt-12 text-center">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-slate-500 text-sm">lock</span>
<span class="text-[11px] font-semibold text-slate-500 uppercase tracking-[0.2em]">End-to-End Encrypted</span>
</div>
<p class="text-xs text-slate-600">Secure access for authorized analysts only</p>
</div>
</div>
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px]"></div>
</div>

<!-- ── Global Session Helpers ─────────────────────────────────────── -->
<script>
  function setUser(phone) { localStorage.setItem("sentinal_user", phone); }
  function getUser()       { return localStorage.getItem("sentinal_user"); }
  function logoutUser() {
    localStorage.removeItem("sentinal_user");
    window.location.href = "../LOGIN IN USER/code.html";
  }
  function checkLogin() {
    if (!getUser()) window.location.href = "../LOGIN IN USER/code.html";
  }

  // If already logged in, skip straight to dashboard
  if (getUser()) window.location.href = "../DASH WITH USER & LOGOUT/code.html";

  function goToOtp() {
    const cc    = document.getElementById("country-code").value;
    const phone = document.getElementById("phone").value.trim();
    if (phone.length < 10) {
      document.getElementById("err-msg").classList.remove("hidden");
      return;
    }
    document.getElementById("err-msg").classList.add("hidden");
    setUser(cc + phone);
    window.location.href = "../OTP WITH CODE/code.html";
  }
</script>
</body></html>
